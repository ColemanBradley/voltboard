function chainRoot(jid){const j=jobs[jid];return(j&&j.parentJobId&&jobs[j.parentJobId])?chainRoot(j.parentJobId):jid;}
function flatChain(jid){const j=jobs[jid];if(!j)return[];return[jid,...(j.returnVisits||[]).flatMap(flatChain)];}

function displayStatus(id){
  const job=jobs[id];if(!job)return'confirmed';
  if(job.status==='invoiced')return'invoiced';
  if(job.returnVisits&&job.returnVisits.length){
    const downstream=flatChain(id).slice(1);
    const allDone=downstream.every(jid=>jobs[jid]&&['complete','invoiced'].includes(jobs[jid].status));
    if(allDone&&['complete','invoiced'].includes(job.status))return'past_followup';
    return'followup';
  }
  return job.status;
}

function renderSBBody(id,bodyId,view,showFollowupPrompt){
  const job=jobs[id];if(!job)return;
  if(!job.checklist)job.checklist=[];
  const jt=getJobType(job.typeKey);const ct=getCustType(job.cust);
  const checks=job.checklist.map((c,i)=>{
    const ico=c.ok===true?'ti-circle-check':c.ok===false?'ti-circle-x':'ti-circle-dot';
    const col=c.ok===true?'#15803d':c.ok===false?'#dc2626':'#d97706';
    return`<div class="ci" onclick="event.stopPropagation();cycleCheck('${id}',${i})" title="Click to toggle">
      <i class="ti ${ico}" style="font-size:15px;color:${col};flex-shrink:0"></i>
      <span style="${c.ok===false?'text-decoration:line-through;opacity:.5':''}${c.ok===true?'color:var(--green-text)':''}">${c.t}</span>
    </div>`;
  }).join('');

  const schedSts=['tentative','confirmed'];
  const statusSel=schedSts.includes(job.status)?`
    <div>
      <div class="sdl" style="margin-bottom:5px">Scheduling status</div>
      <div class="status-selector">
        ${schedSts.map(s=>`<button class="status-opt${job.status===s?' sel-'+s:''}" onclick="setStatus('${id}','${s}')"><div class="sdot ${s}"></div>${STATUS_LABELS[s]}${job.status===s?'<i class="ti ti-check" style="margin-left:auto;font-size:11px"></i>':''}</button>`).join('')}
      </div>
    </div><div class="divider"></div>`:'' ;

  const followupPrompt=showFollowupPrompt?`
    <div class="followup-prompt">
      <div class="followup-prompt-title"><i class="ti ti-rotate-clockwise" style="font-size:14px"></i>Need a follow-up visit?</div>
      <div class="followup-btns">
        <button class="fp-yes" onclick="openReturnModal('${id}','${view}')"><i class="ti ti-plus" style="font-size:11px"></i> Yes, add return visit</button>
        <button class="fp-no" onclick="dismissFollowup('${id}','${view}')">No, all done</button>
      </div>
    </div>`:'';

  let actions='';
  const linkedIds=getLinkedJobIds(id).filter(jid=>jid!==id&&jobs[jid]);
  const hasLinks=linkedIds.length>0;
  if(schedSts.includes(job.status)){
    actions+=`<div class="arow"><button class="ab primary"><i class="ti ti-send" style="font-size:11px"></i>Send reminder</button><button class="ab green" onclick="markComplete('${id}','${view}')"><i class="ti ti-check" style="font-size:11px"></i>${hasLinks?'Mark all complete':'Mark complete'}</button></div>`;
  }
  if(job.status==='complete'){
    actions+=`<div class="arow"><button class="ab qbo" onclick="sendQBO('${id}')"><i class="ti ti-file-invoice" style="font-size:11px"></i>Send to QuickBooks</button></div>`;
    actions+=`<div class="arow"><button class="ab" onclick="markBilled('${id}')" style="font-size:10px;color:var(--text3)"><i class="ti ti-circle-check" style="font-size:11px"></i>Mark as billed</button></div>`;
    actions+=`<div class="arow"><button class="ab" onclick="openSBWithFollowup('${id}','${view}')" style="font-size:10px;color:var(--text3)"><i class="ti ti-rotate-clockwise" style="font-size:11px"></i>Add follow-up visit</button></div>`;
    actions+=`<div class="arow"><button class="ab" onclick="markIncomplete('${id}')" style="font-size:10px;color:var(--text3)"><i class="ti ti-arrow-back-up" style="font-size:11px"></i>Mark as incomplete</button></div>`;
  }
  if(job.status==='followup')actions+=`<div class="arow"><button class="ab qbo" onclick="sendQBO('${id}')"><i class="ti ti-file-invoice" style="font-size:11px"></i>Send to QuickBooks</button></div>`;
  if(job.status==='invoiced'){
    if(job.qboSent)actions+=`<div class="qbo-note"><i class="ti ti-clipboard-check" style="font-size:14px;flex-shrink:0;margin-top:1px"></i><span>Job description copied to clipboard. QuickBooks opened — paste into the invoice memo field.</span></div>`;
    actions+=`<div class="arow"><button class="ab" onclick="markIncomplete('${id}')" style="font-size:10px;color:var(--text3)"><i class="ti ti-arrow-back-up" style="font-size:11px"></i>Mark as incomplete</button></div>`;
  }
  actions+=`<div class="arow"><button class="ab" onclick="openAddModal('${id}')"><i class="ti ti-edit" style="font-size:11px"></i>Edit</button><button class="ab danger" onclick="deleteJob('${id}','${view}')"><i class="ti ti-trash" style="font-size:11px"></i>Delete</button></div>`;

  const addrHtml=job.addr?`<div class="sdv addr"><i class="ti ti-map-pin" style="font-size:11px;margin-right:3px"></i>${job.addr}</div>`:'';

  // Job chain — show for any job that has a parent OR has return visits
  let linkedHtml='';
  const hasParent=!!job.parentJobId&&!!jobs[job.parentJobId];
  const hasReturns=!!(job.returnVisits&&job.returnVisits.length);
  const allLinked=getLinkedJobIds(id);
  if(hasParent||hasReturns||allLinked.length>1){
    const root=chainRoot(id);
    const ordered=flatChain(root);
    // Find the index of the current job to determine what's "past"
    const currentIdx=ordered.indexOf(id);
    const items=ordered.map((jid,i)=>{
      const j=jobs[jid];if(!j)return'';
      const isCurrent=jid===id;
      const isPast=i<currentIdx;
      const isDone=['complete','invoiced'].includes(j.status);
      // A followup job that has a return scheduled (returnVisits exists) is "past followup" — pale amber
      const isPastFollowup=j.status==='followup'&&(j.returnVisits&&j.returnVisits.length>0);
      const dotClass=isDone?'done':isCurrent?'current':isPastFollowup?'past-followup':'pending';
      const ds=j.startDate?fmtDate(j.startDate):'Unscheduled';
      const visitLabel=i===0?'Original job':`Visit ${i+1}`;
      const checkIcon=isDone?`<i class="ti ti-check" style="font-size:10px;color:var(--green);margin-right:3px"></i>`:'';
      // Styling per state
      let cardStyle='border:1px solid var(--border);background:var(--surface);';
      let nameColor='color:var(--text);';
      let metaColor='color:var(--text3);';
      if(isCurrent){cardStyle='border:1px solid #93c5fd;background:#eff6ff;';nameColor='color:var(--blue-text);';metaColor='color:var(--blue);';}
      else if(isDone){cardStyle='border:1px solid var(--border);background:var(--surface);opacity:.65;';}
      else if(isPastFollowup){cardStyle='border:1px solid #fde68a;background:#fffdf5;opacity:.7;';nameColor='color:var(--amber-text);';metaColor='color:var(--amber);';}
      else if(j.status==='followup'){cardStyle='border:1px solid #fcd34d;background:#fffbeb;';nameColor='color:var(--amber-text);';metaColor='color:var(--amber-text);';}
      let dotStyle='';
      if(dotClass==='past-followup')dotStyle='background:#fde68a;border-color:#f59e0b;opacity:.6;';
      else if(dotClass==='pending')dotStyle='background:#fde68a;border-color:#f59e0b;';
      const connector=i<ordered.length-1?`<div class="chain-connector"></div>`:'';
      return`<div class="chain-item">
        <div class="chain-line"><div class="chain-dot ${isDone?'done':isCurrent?'current':''}" style="${dotStyle}"></div>${connector}</div>
        <div class="chain-card ${isCurrent?'current':isDone?'done':''}" style="${cardStyle}cursor:pointer;padding:6px 9px;border-radius:var(--radius);margin:3px 0;" onclick="openSB('${jid}','${view}')">
          <div class="chain-name" style="${nameColor}">${checkIcon}${j.name}</div>
          <div class="chain-meta" style="${metaColor}">${ds} · ${visitLabel}${isCurrent?' · Viewing now':''}</div>
        </div>
      </div>`;
    }).join('');
    linkedHtml=`<div class="divider"></div><div><div class="sdl">Job chain</div><div style="display:flex;flex-direction:column">${items}</div></div>`;
  }

  document.getElementById(bodyId).innerHTML=`
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:30px;height:30px;border-radius:7px;background:${jt.iconBg};display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ${jt.icon}" style="font-size:15px;color:${jt.color}"></i></div>
      <div><span class="sbadge ${displayStatus(id)}">${STATUS_LABELS[job.status]}</span><div style="font-size:10px;color:var(--text3);margin-top:2px">${ct.label}</div></div>
    </div>
    ${statusSel}${followupPrompt}
    <div><div class="sdl">Contact</div><div class="sdv phone">${job.phone}</div>${addrHtml}</div>
    <div>
      <div class="sdl">Scheduled</div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap">
        <input type="date" value="${dateToInput(job.startDate)}" onchange="updateJobDate('${id}',this.value)" style="flex:1;min-width:120px;padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--surface);outline:none"/>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          <button onclick="updateJobWorkDays('${id}',-1)" style="width:24px;height:24px;border:1px solid var(--border);border-radius:var(--radius);background:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2)">−</button>
          <span style="font-size:12px;font-weight:500;min-width:20px;text-align:center" id="wd-${id}">${job.workDays}</span>
          <button onclick="updateJobWorkDays('${id}',1)" style="width:24px;height:24px;border:1px solid var(--border);border-radius:var(--radius);background:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2)">+</button>
          <span style="font-size:11px;color:var(--text3)">day${job.workDays!==1?'s':''}</span>
        </div>
      </div>
    </div>
    ${linkedHtml}
    <div class="divider"></div>
    <div>
      <button onclick="toggleChecklist(this)" style="display:flex;align-items:center;gap:5px;width:100%;background:none;border:none;cursor:pointer;padding:0;text-align:left;">
        <div class="sdl" style="margin-bottom:0;flex:1">Readiness checklist</div>
        <i class="ti ti-chevron-right" style="font-size:11px;color:var(--text3);transition:transform .15s"></i>
      </button>
      <div class="checklist" style="display:none;margin-top:7px">${checks}</div>
    </div>
    <div><div class="sdl">Description</div><textarea
      onchange="updateJobNotes('${id}',this.value)"
      onfocus="this.style.borderColor='var(--blue)'"
      onblur="this.style.borderColor='var(--border)'"
      style="width:100%;padding:9px;background:var(--surface2);border-radius:var(--radius);font-size:11px;color:${job.notes?'var(--text2)':'var(--text3)'};line-height:1.6;border:1px solid var(--border);font-family:'DM Sans',sans-serif;resize:vertical;min-height:64px;outline:none"
      placeholder="No description — type here to add details."
    >${job.notes||''}</textarea></div>
    <div class="divider"></div>
    ${actions}`;
}

function updateJobWorkDays(id,delta){const j=jobs[id];j.workDays=Math.max(1,j.workDays+delta);rebuildAll();const el=document.getElementById('wd-'+id);if(el)el.textContent=j.workDays;}
function markComplete(id,view){
  getLinkedJobIds(id).forEach(jid=>{
    if(jobs[jid]&&!['invoiced'].includes(jobs[jid].status))jobs[jid].status='complete';
  });
  openSBWithFollowup(id,view);
}
function dismissFollowup(id,view){

    closeMobileJob();
    return;
  }
  const v=currentView==='week'?'week':'month';
  const bodyId=v==='month'?'msb-body':'wsb-body';

}
function sendQBO(id){
  jobs[id].status='invoiced';jobs[id].qboSent=true;
  const inv=jobs[id].checklist.find(c=>c.t.toLowerCase().includes('invoice'));
  if(inv)inv.ok=true;
  // Copy job description to clipboard
  const notes=jobs[id].notes||'';
  if(notes){
    navigator.clipboard.writeText(notes).catch(()=>{});
  }
  // Open QBO new invoice page
  window.open('https://app.qbo.intuit.com/app/invoice','_blank');
  rebuildAll();refreshSB();
}
function markBilled(id){jobs[id].status='invoiced';jobs[id].qboSent=false;rebuildAll();refreshSB();}
function markIncomplete(id){jobs[id].status='confirmed';jobs[id].qboSent=false;rebuildAll();refreshSB();}
function unscheduleJob(id){
  if(!jobs[id])return;
  const job=jobs[id];
  job.startDate=null;
  // Add back to unscheduled queue if not already there
  if(!unscheduled.find(u=>u.id===id)){
    unscheduled.push({id,typeKey:job.typeKey,label:job.name,cust:job.cust});
  }
  rebuildAll();
}
function deleteJob(id,view){if(!confirm(`Delete "${jobs[id].name}"?`))return;delete jobs[id];const sbId=currentView==='week'?'week-sb':'month-sb';closeSB(sbId);rebuildAll();}

function openAddModal(editId){
  editingJobId=editId||null;populateSelects();
  document.getElementById('modal-heading').textContent=editId?'Edit job':'Add new job';
  document.getElementById('modal-save-btn').textContent=editId?'Save changes':'Add to unscheduled';
  if(editId){
    const j=jobs[editId]||(unscheduled.find(u=>u.id===editId)?{customer:unscheduled.find(u=>u.id===editId).label,phone:'',typeKey:unscheduled.find(u=>u.id===editId).typeKey,cust:unscheduled.find(u=>u.id===editId).cust,checklist:[],notes:'',addr:''}:null);
    if(!j)return;
    document.getElementById('f-name').value=j.customer||j.name||'';
    document.getElementById('f-phone').value=(j.phone==='—'||!j.phone)?'':j.phone;
    document.getElementById('f-type').value=j.typeKey;
    document.getElementById('f-cust').value=j.cust||'ho';
    document.getElementById('f-checklist').value=(j.checklist||[]).map(c=>c.t).join('\n');
    document.getElementById('f-notes').value=j.notes||'';
    if(j.addr){const parts=j.addr.split(',');document.getElementById('f-addr1').value=parts[0]?.trim()||'';const cz=(parts[1]||'').trim();const si=cz.lastIndexOf(' ');if(si>0){document.getElementById('f-city').value=cz.substring(0,si).trim();document.getElementById('f-zip').value=cz.substring(si+1).trim();}else document.getElementById('f-city').value=cz;if(!addrOpen)toggleAddr();}
    else{['f-addr1','f-city','f-zip'].forEach(i=>document.getElementById(i).value='');if(addrOpen)toggleAddr();}
  } else {
    ['f-name','f-phone','f-notes','f-addr1','f-city','f-zip'].forEach(i=>document.getElementById(i).value='');
    applyDefaultChecklist(document.getElementById('f-type').value);
    if(addrOpen)toggleAddr();
  }
  document.getElementById('f-type').onchange=function(){if(!editingJobId)applyDefaultChecklist(this.value);};
  document.getElementById('add-modal').style.display='flex';

function closeAddModal(){document.getElementById('add-modal').style.display='none';editingJobId=null;pendingReturnParentId=null;pendingReturnView=null;}
// Enter key saves from any input/select in the modal
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('add-modal').style.display==='flex'){
    if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT'){
      e.preventDefault();saveJob();
    }
  }
});
function saveJob(){
  const name=document.getElementById('f-name').value.trim();if(!name){document.getElementById('f-name').focus();return;}
  const phone=document.getElementById('f-phone').value.trim()||'—';
  const typeKey=document.getElementById('f-type').value;const cust=document.getElementById('f-cust').value;
  const notes=document.getElementById('f-notes').value.trim();
  const clRaw=document.getElementById('f-checklist').value.trim();
  const checklist=clRaw?clRaw.split('\n').filter(l=>l.trim()).map(t=>({ok:null,t:t.trim()})):[{ok:null,t:'Confirm with customer'},{ok:null,t:'Materials ready'}];
  const a1=document.getElementById('f-addr1').value.trim();
  const city=document.getElementById('f-city').value.trim();
  const zip=document.getElementById('f-zip').value.trim();
  const addr=[a1,[city,zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  if(editingJobId){
    // Could be editing a scheduled job or an unscheduled one
    if(jobs[editingJobId]){Object.assign(jobs[editingJobId],{name,customer:name,phone,typeKey,cust,notes,checklist,addr});}
    else{const u=unscheduled.find(u=>u.id===editingJobId);if(u){u.label=name;u.typeKey=typeKey;u.cust=cust;}}
    rebuildAll();refreshSB();
  } else if(pendingReturnParentId){
    jobs[pendingReturnParentId].status='followup';
    const retId='ret_'+Date.now();
    // Find the root job to count how many returns already exist
    const root=chainRoot(pendingReturnParentId);
    const existingChain=flatChain(root);
    const visitNum=existingChain.length;
    const baseName=jobs[root].customer||jobs[root].name;
    const displayName=visitNum===1?`${baseName} — Return`:`${baseName} — Return ${visitNum}`;
    jobs[retId]={name:displayName,typeKey,status:'followup',workDays:1,startDate:null,cust,customer:baseName,phone,addr,checklist,notes,parentJobId:pendingReturnParentId};
    if(!jobs[pendingReturnParentId].returnVisits)jobs[pendingReturnParentId].returnVisits=[];
    jobs[pendingReturnParentId].returnVisits.push(retId);
    unscheduled.push({id:retId,typeKey,label:displayName,cust});
    const rv=pendingReturnView;
    closeAddModal();
    rebuildAll();openSB(pendingReturnParentId,rv);
  } else {
    const id='job_'+Date.now();
    unscheduled.push({id,typeKey,label:name,cust});
    jobs[id]={name,typeKey,status:'confirmed',workDays:1,startDate:null,cust,customer:name,phone,addr,checklist,notes};
    closeAddModal();
    updateQueueCount();
    buildQueue();
    return;
  }
  closeAddModal();
}

// ── MOUSE-BASED TILE DRAG (bypasses scroll container restrictions) ──
let tileDragging=false;
let tileDragGhost=null;
let tileDragId=null;
let tileDragMoved=false;

function startTileDrag(e,id,tile,rowEl,rowDates){
  tileDragging=true;
  tileDragId=id;
  tileDragMoved=false;
  tileDragGhost=tile.cloneNode(true);
  tileDragGhost.style.position='fixed';
  tileDragGhost.style.pointerEvents='none';
  tileDragGhost.style.opacity='.7';
  tileDragGhost.style.zIndex='9999';
  tileDragGhost.style.width=tile.getBoundingClientRect().width+'px';
  tileDragGhost.style.height=tile.getBoundingClientRect().height+'px';
  tileDragGhost.style.left=(e.clientX-parseInt(tileDragGhost.style.width)/2)+'px';
  tileDragGhost.style.top=(e.clientY-10)+'px';
  document.body.appendChild(tileDragGhost);
  tile.style.opacity='.3';
  document.body.classList.add('dragging-job');

  function onMove(ev){
    tileDragGhost.style.left=(ev.clientX-parseInt(tileDragGhost.style.width)/2)+'px';
    tileDragGhost.style.top=(ev.clientY-10)+'px';
    highlightDropTarget(ev.clientX,ev.clientY);
    tileDragMoved=true;
  }

  function onUp(ev){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    clearDropHighlights();
    tileDragGhost.remove();tileDragGhost=null;
    tile.style.opacity='';
    document.body.classList.remove('dragging-job');
    dropTileAt(ev.clientX,ev.clientY,id);
    setTimeout(()=>{tileDragging=false;tileDragId=null;},50);
  }

  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function highlightDropTarget(x,y){
  clearDropHighlights();
  const rows=document.querySelectorAll('.mv-week-row');
  for(const row of rows){
    const rect=row.getBoundingClientRect();
    if(y>=rect.top&&y<=rect.bottom){
      const ci=Math.max(0,Math.min(6,Math.floor((x-rect.left)/(rect.width/7))));
      const cells=row.querySelectorAll('.mv-day-cell');
      if(cells[ci])cells[ci].style.background='#eff6ff';
      // Check queue panel
      break;
    }
  }
  // Highlight queue panel if hovering over it
  const qp=document.getElementById('queue-panel');
  if(qp){
    const qr=qp.getBoundingClientRect();
    if(x>=qr.left&&x<=qr.right&&y>=qr.top&&y<=qr.bottom){
      qp.classList.add('drag-over');
    }
  }
}

function clearDropHighlights(){
  document.querySelectorAll('.mv-day-cell').forEach(c=>c.style.background='');
  document.getElementById('queue-panel')?.classList.remove('drag-over');
}

function dropTileAt(x,y,id){
  // Check if dropped on queue panel
  const qp=document.getElementById('queue-panel');
  if(qp){
    const qr=qp.getBoundingClientRect();
    if(x>=qr.left&&x<=qr.right&&y>=qr.top&&y<=qr.bottom){
      unscheduleJob(id);return;
    }
  }
  // Find which row and column
  const rows=document.querySelectorAll('.mv-week-row');
  for(const row of rows){
    const rect=row.getBoundingClientRect();
    if(y>=rect.top&&y<=rect.bottom){
      const ci=Math.max(0,Math.min(6,Math.floor((x-rect.left)/(rect.width/7))));
      const cells=row.querySelectorAll('.mv-day-cell');
      const cell=cells[ci];
      if(!cell)break;
      const ds=cell.dataset.date;
      if(!ds)break;
      const[cy,cm,cd]=ds.split('-').map(Number);
      const dropDate=new Date(cy,cm-1,cd);
      jobs[id].startDate=dropDate;
      jobs[id].placedAt=Date.now();
      rebuildAll();buildQueue();
      return;
    }
  }
}

// ── DEVICE DETECTION ──
function getDevice(){
  const w=window.innerWidth;
  const ua=navigator.userAgent;
  const isTouch=navigator.maxTouchPoints>1;
  const isRetina=window.devicePixelRatio>=2;
  if(w<=500||(/iPhone|Android.*Mobile/i.test(ua)))return'phone';
  // iPad Pro reports as Mac but has touch + retina + width <= 1366
  if(isTouch&&isRetina&&w<=1366)return'tablet';
  if(/iPad/i.test(ua))return'tablet';
  return'desktop';
}

const SB_HEADERS={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

let syncTimeout=null;

function setSyncStatus(state){
  const el=document.getElementById('sync-indicator');
  if(!el)return;
  if(state==='saving')el.innerHTML=`<i class="ti ti-cloud-upload" style="font-size:12px"></i> Saving…`;
  else if(state==='saved')el.innerHTML=`<i class="ti ti-cloud-check" style="font-size:12px;color:#4ade80"></i> Saved`;
  else if(state==='loading')el.innerHTML=`<i class="ti ti-cloud-download" style="font-size:12px"></i> Loading…`;
  else if(state==='error')el.innerHTML=`<i class="ti ti-cloud-x" style="font-size:12px;color:#f87171"></i> Sync error`;
  else el.innerHTML='';
}

async function sbSave(){
  setSyncStatus('saving');
  try{
    const jobRows=Object.entries(jobs).map(([id,data])=>({id,data}));
    jobRows.push({id:'__unscheduled__',data:unscheduled});

    const res=await fetch(`${SB_URL}/rest/v1/jobs`,{
      method:'POST',
      headers:{...SB_HEADERS,'Prefer':'return=minimal,resolution=merge-duplicates'},
      body:JSON.stringify(jobRows)
    });
    if(!res.ok){
      const err=await res.text();
      console.error('Supabase save failed:',res.status,err);
      throw new Error(err);
    }

    // Delete rows no longer in jobs
    const allIds=Object.keys(jobs).concat(['__unscheduled__']);
    const listRes=await fetch(`${SB_URL}/rest/v1/jobs?select=id`,{headers:SB_HEADERS});
    if(listRes.ok){
      const stored=await listRes.json();
      const toDelete=stored.filter(r=>!allIds.includes(r.id));
      if(toDelete.length){
        const ids=toDelete.map(r=>`"${r.id}"`).join(',');
        await fetch(`${SB_URL}/rest/v1/jobs?id=in.(${ids})`,{method:'DELETE',headers:SB_HEADERS});
      }
    }
    setSyncStatus('saved');
    setTimeout(()=>setSyncStatus(''),3000);
  }catch(e){
    console.error('Supabase sync error:',e);
    setSyncStatus('error');
  }
}

function scheduleSave(){
  clearTimeout(syncTimeout);
  syncTimeout=setTimeout(sbSave,1500);
}

async function sbLoad(){
  setSyncStatus('loading');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/jobs?select=id,data`,{headers:SB_HEADERS});
    if(!res.ok)throw new Error(await res.text());
    const rows=await res.json();
    if(!rows.length){setSyncStatus('');return false;} // no data yet
    const newJobs={};
    let newUnscheduled=null;
    rows.forEach(row=>{
      if(row.id==='__unscheduled__')newUnscheduled=row.data;
      else{
        // Restore Date objects from ISO strings
        const j=row.data;
        if(j.startDate)j.startDate=new Date(j.startDate);
        newJobs[row.id]=j;
      }
    });
    jobs=newJobs;
    if(newUnscheduled)unscheduled=newUnscheduled;
    setSyncStatus('saved');
    setTimeout(()=>setSyncStatus(''),3000);
    return true;
  }catch(e){
    console.error('Supabase load error:',e);
    setSyncStatus('error');
    return false;
  }
}
